<video autoplay muted loop playsinline class="bg-video">
    <source src="images/bgvideo.mp4" type="video/mp4">
</video>
<div class="overlay d-flex justify-content-center align-items-center vh-100">

    <div class="card login-card p-4 shadow-lg">
        <div class="text-center mb-4">
            <h2 class="fw-bold text-white">
                Welcome Back 👋
            </h2>
            <p class="text-white-50">
                Login to continue
            </p>
        </div>
        <input
            type="email"
            class="form-control mb-3 bg-transparent text-white"
            placeholder="Email">
        <input
            type="password"
            class="form-control mb-3 bg-transparent text-white"
            placeholder="Password">
        <div class="d-flex justify-content-between mb-4">
            <a href="#" class="text-warning text-decoration-none">
                Forgot Password?
            </a>
        </div>
        <button class="btn btn-warning w-100 fw-bold" routerLink="/dashboard">
            Login
        </button>
        <p class="text-center text-white mt-4">
            Don't have an account?
            <a routerLink="/signup" class="text-warning text-decoration-none fw-bold"> signup</a>
        </p>
    </div>
</div>
