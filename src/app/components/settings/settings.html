<div class="settings-page">

  <!-- Compact Heading -->
  <div
    class="settings-heading d-flex flex-column flex-md-row
           justify-content-between align-items-md-center gap-2">

    <div>
      <p class="page-label mb-1">
        EMPLOYEE ACCOUNT
      </p>

      <h2 class="fw-bold mb-1">
        Settings
      </h2>

      <p class="page-subtitle mb-0">
        Manage pantry notifications and application preferences.
      </p>
    </div>

    <button
      type="button"
      class="save-settings-btn"
      (click)="saveSettings()">

      <i class="fa-solid fa-check me-2"></i>
      Save

    </button>

  </div>

  <!-- Message -->
  <div
    *ngIf="savedMessage"
    class="saved-message"
    role="alert">

    <i class="fa-solid fa-circle-check me-2"></i>
    {{ savedMessage }}

  </div>

  <div class="settings-card">

    <!-- Notifications -->
    <section class="settings-section">

      <div class="section-heading">

        <div class="section-icon">
          <i class="fa-regular fa-bell"></i>
        </div>

        <div>
          <h5 class="fw-bold mb-0">
            Notifications
          </h5>

          <p class="section-description mb-0">
            Choose the pantry updates you want to receive.
          </p>
        </div>

      </div>

      <div class="notification-grid">

        <label class="setting-option">

          <div>
            <h6 class="mb-1">
              Order ready
            </h6>

            <p class="mb-0">
              Notify me when my order is ready.
            </p>
          </div>

          <div class="form-check form-switch mb-0">
            <input
              id="orderReady"
              type="checkbox"
              class="form-check-input"
              [(ngModel)]="orderReadyNotification">
          </div>

        </label>

        <label class="setting-option">

          <div>
            <h6 class="mb-1">
              Daily menu
            </h6>

            <p class="mb-0">
              Notify me when today's menu is available.
            </p>
          </div>

          <div class="form-check form-switch mb-0">
            <input
              id="dailyMenu"
              type="checkbox"
              class="form-check-input"
              [(ngModel)]="dailyMenuNotification">
          </div>

        </label>

        <label class="setting-option">

          <div>
            <h6 class="mb-1">
              Offers
            </h6>

            <p class="mb-0">
              Receive pantry combo and discount updates.
            </p>
          </div>

          <div class="form-check form-switch mb-0">
            <input
              id="offers"
              type="checkbox"
              class="form-check-input"
              [(ngModel)]="offerNotification">
          </div>

        </label>

      </div>

    </section>

    <!-- Preferences -->
    <section class="settings-section section-border">

      <div class="section-heading">

        <div class="section-icon">
          <i class="fa-solid fa-sliders"></i>
        </div>

        <div>
          <h5 class="fw-bold mb-0">
            Preferences
          </h5>

          <p class="section-description mb-0">
            Customize your pantry experience.
          </p>
        </div>

      </div>

      <div class="row g-3">

        <div class="col-md-6">

          <label
            for="language"
            class="form-label">

            Language

          </label>

          <select
            id="language"
            class="form-select settings-input"
            [(ngModel)]="language">

            <option>English</option>
            <option>Hindi</option>
            <option>Marathi</option>

          </select>

        </div>

        <div class="col-md-6">

          <label
            for="defaultCategory"
            class="form-label">

            Default Menu Category

          </label>

          <select
            id="defaultCategory"
            class="form-select settings-input"
            [(ngModel)]="defaultCategory">

            <option>Recommended</option>
            <option>Coffee & Tea</option>
            <option>Nuts & Dry Fruits</option>
            <option>Office Snacks</option>

          </select>

        </div>

        <div class="col-md-6">

          <label
            for="dietaryPreference"
            class="form-label">

            Dietary Preference

          </label>

          <select
            id="dietaryPreference"
            class="form-select settings-input"
            [(ngModel)]="dietaryPreference">

            <option>Vegetarian</option>
            <option>Non-Vegetarian</option>
            <option>Vegan</option>
            <option>No Preference</option>

          </select>

        </div>

        <div class="col-md-6">

          <label
            for="theme"
            class="form-label">

            Appearance

          </label>

          <select
            id="theme"
            class="form-select settings-input"
            [(ngModel)]="theme">

            <option>Light</option>
            <option>Dark</option>
            <option>System Default</option>

          </select>

        </div>

      </div>

    </section>

    <!-- Bottom Actions -->
    <div class="settings-actions">

      <button
        type="button"
        class="reset-btn"
        (click)="resetSettings()">

        Reset

      </button>

      <button
        type="button"
        class="save-settings-btn"
        (click)="saveSettings()">

        <i class="fa-solid fa-check me-2"></i>
        Save Changes

      </button>

    </div>

  </div>

</div>
