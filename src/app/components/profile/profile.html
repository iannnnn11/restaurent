<div class="profile-layout min-vh-100">

  <div class="container-fluid">
    <div class="row g-0">

      <!-- Permanent Sidebar -->
      <aside class="col-lg-3 col-xl-2 d-none d-lg-block profile-sidebar">

        <div class="sidebar-inner d-flex flex-column">

          <!-- Brand -->
          <a
            routerLink="/dashboard"
            class="brand-wrapper text-decoration-none"
          >
            <div class="brand-logo">
              <i class="fa-solid fa-utensils"></i>
            </div>

            <div>
              <h4 class="fw-bold text-dark mb-0">
                Jode<span class="text-success">Tx</span>
              </h4>

              <small class="text-secondary">
                Office Pantry
              </small>
            </div>
          </a>

          <!-- Employee -->
          <div class="employee-card">

            <div class="employee-avatar">
              IH
            </div>

            <div class="overflow-hidden">
              <h6 class="fw-bold mb-0 text-truncate">
                Ian Honey
              </h6>

              <small class="text-secondary">
                Employee
              </small>
            </div>

          </div>

          <p class="menu-label">
            Account
          </p>

          <!-- Navigation -->
          <nav class="nav flex-column gap-2">

            <a
              routerLink="details"
              routerLinkActive="active"
              class="nav-link sidebar-link"
            >
              <span class="sidebar-icon">
                <i class="fa-regular fa-user"></i>
              </span>

              <span>Profile Details</span>
            </a>

            <a
              routerLink="activity"
              routerLinkActive="active"
              class="nav-link sidebar-link"
            >
              <span class="sidebar-icon">
                <i class="fa-solid fa-clock-rotate-left"></i>
              </span>

              <span>Activity</span>
            </a>

            <a
              routerLink="security"
              routerLinkActive="active"
              class="nav-link sidebar-link"
            >
              <span class="sidebar-icon">
                <i class="fa-solid fa-shield-halved"></i>
              </span>

              <span>Security</span>
            </a>

            <a
              routerLink="settings"
              routerLinkActive="active"
              class="nav-link sidebar-link"
            >
              <span class="sidebar-icon">
                <i class="fa-solid fa-sliders"></i>
              </span>

              <span>Settings</span>
            </a>

          </nav>

          <!-- Logout -->
          <div class="mt-auto pt-4">

            <button
              type="button"
              class="btn logout-btn w-100"
              (click)="logout()"
            >
              <i class="fa-solid fa-right-from-bracket me-2"></i>
              Logout
            </button>

          </div>

        </div>

      </aside>

      <!-- Changing right side -->
      <main class="col-lg-9 col-xl-10 profile-content">

        <!-- Mobile header -->
        <header class="profile-header">

          <div>
            <p class="text-success fw-semibold small mb-1">
              JodeTx Employee Portal
            </p>

            <h5 class="fw-bold mb-0">
              Account Management
            </h5>
          </div>

          <a
            routerLink="/dashboard"
            class="btn btn-light border rounded-3"
          >
            <i class="fa-solid fa-house me-2"></i>
            Dashboard
          </a>

        </header>

        <!-- Only this part routes -->
        <section class="profile-router-area">

          <router-outlet></router-outlet>

        </section>

      </main>

    </div>
  </div>

</div>
